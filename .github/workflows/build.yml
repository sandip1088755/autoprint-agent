name: Build AutoPrint Agent

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find csproj
        id: find
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "AutoPrintAgent.csproj"
          if ($files.Count -eq 0) { Write-Host "Not found"; exit 1 }
          $path = $files[0].FullName.Replace("$env:GITHUB_WORKSPACE\", "").Replace("\", "/")
          Write-Host "Found: $path"
          echo "path=$path" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: dotnet publish "${{ steps.find.outputs.path }}" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Rename
        shell: pwsh
        run: Move-Item publish/AutoPrintAgent.exe publish/AutoPrintAgent-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPrintAgent-Setup
          path: publish/AutoPrintAgent-Setup.exe
          retention-days: 90

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.4-build-${{ github.run_number }}
          name: AutoPrint Agent v2.0.4
          files: publish/AutoPrintAgent-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
