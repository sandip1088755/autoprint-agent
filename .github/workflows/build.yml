name: Build AutoPrint Agent

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AutoPrintAgent/AutoPrintAgent.csproj

      - name: Publish
        run: dotnet publish AutoPrintAgent/AutoPrintAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Rename
        run: Move-Item publish/AutoPrintAgent.exe publish/AutoPrintAgent-Setup.exe
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPrintAgent-Setup
          path: publish/AutoPrintAgent-Setup.exe
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.4-build-${{ github.run_number }}
          name: AutoPrint Agent v2.0.4
          files: publish/AutoPrintAgent-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
