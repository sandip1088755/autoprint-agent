name: Build AutoPrint Agent

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Find csproj file
      id: find-csproj
      shell: pwsh
      run: |
        Write-Host "=== Repository structure ==="
        Get-ChildItem -Recurse -Filter "*.csproj" | ForEach-Object {
          Write-Host "Found: $($_.FullName)"
        }

        $csproj = Get-ChildItem -Recurse -Filter "AutoPrintAgent.csproj" | Select-Object -First 1
        if ($null -eq $csproj) {
          Write-Host "ERROR: AutoPrintAgent.csproj not found!"
          Get-ChildItem -Recurse | Select-Object -First 50 | ForEach-Object {
            Write-Host "  $($_.FullName.Replace('$env:GITHUB_WORKSPACE', ''))"
          }
          exit 1
        }

        $relativePath = $csproj.FullName.Replace("$env:GITHUB_WORKSPACE\", "").Replace("\", "/")
        Write-Host "Using csproj: $relativePath"
        "csproj_path=$relativePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Display .NET version
      run: dotnet --version

    - name: Restore dependencies
      run: dotnet restore "${{ steps.find-csproj.outputs.csproj_path }}"

    - name: Build and Publish
      shell: pwsh
      run: |
        dotnet publish "${{ steps.find-csproj.outputs.csproj_path }}" `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o ./publish

    - name: Verify output
      shell: pwsh
      run: |
        Write-Host "=== Publish folder contents ==="
        Get-ChildItem ./publish | ForEach-Object {
          Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
        }

        if (-not (Test-Path "./publish/AutoPrintAgent.exe")) {
          Write-Host "ERROR: AutoPrintAgent.exe not generated!"
          exit 1
        }

        Move-Item ./publish/AutoPrintAgent.exe ./publish/AutoPrintAgent-Setup.exe -Force
        Write-Host "✅ Renamed to AutoPrintAgent-Setup.exe"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoPrintAgent-Setup
        path: ./publish/AutoPrintAgent-Setup.exe
        retention-days: 90

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.4-build-${{ github.run_number }}
        name: AutoPrint Agent v2.0.4 (Build ${{ github.run_number }})
        body: |
          # AutoPrint Print Agent v2.0.4

          **Download:** `AutoPrintAgent-Setup.exe` (niche)

          ## Installation:
          1. Download .exe file
          2. Right-click → Run as administrator
          3. Enter Shop ID & Secret Key (from shop panel)
          4. Select printers
          5. Done! Agent will run in system tray

          ## Requirements:
          - Windows 10 or 11 (64-bit)
          - Internet connection
          - Printer connected

          ## Support:
          - Email: support@autoprint.in
          - WhatsApp: +91 98765 43210
        files: ./publish/AutoPrintAgent-Setup.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
